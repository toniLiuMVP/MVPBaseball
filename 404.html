<script>
// GitHub Pages 的 project site 會把 404 頁用在任何深度的網址上,
// 相對路徑與絕對路徑都會有一種情況失效。這裡在執行時算出正確的站根。
// HTML 裡寫死的 /MVPBaseball/ 是「JS 被關掉」時的退路 —— 對實際部署的
// project site 正確;JS 有開的話下面會依實際網址重算,涵蓋倉庫改名或自訂網域
// (不涵蓋改成 user site,見下面那條註解)。
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  // 這裡把所有 *.github.io 都當成 project site,第一段就是倉庫名稱;
  // 自訂網域走 '/'。唯一算錯的是 user site(倉庫名叫「帳號.github.io」、
  // 站根就是 /),純前端分辨不出來,真要改成那樣這段也要一起改。
  var base = (location.hostname.endsWith('github.io') && seg.length > 0)
             ? '/' + seg[0] + '/'
             : '/';
  // 找不到某個 id 就跳過那一條:少一個出口不該讓後面的網址修正整段停掉。
  function setHref(id, href) { var a = document.getElementById(id); if (a) a.href = href; }
  setHref('home', base);
  setHref('tut', base + 'tutorials/');
  setHref('pages', base + 'pages.html');
  setHref('do', base + 'do.html');
  setHref('start', base + 'start.html');
  setHref('rpt', base + 'report.html#bug');
  setHref('lgl', base + 'legal.html');

  // 網址修正:從聊天訊息複製網址時,後面有可能黏到中文或全形標點;站根後面的大小寫也可能打錯。
  // 先把路徑尾端不屬於網址的字去掉,沒有可去的才改成小寫;跟原本不同就換過去再試一次。
  // 每跳一次路徑只會變短或變小寫,所以最多跳兩次就停;目標一定是同一個站根底下的路徑。
  // 只讀 location、不送任何東西出去。修不好的話讀者看到的還是這一頁,跟沒有這段一樣。
  var rest;
  try { rest = decodeURIComponent(location.pathname); } catch (e) { rest = location.pathname; }
  if (rest.indexOf(base) !== 0) return;
  rest = rest.slice(base.length);
  var fixed = rest.replace(/[^A-Za-z0-9\/_-]+$/, '');
  if (fixed === rest) fixed = rest.toLowerCase();
  if (fixed === rest) return;
  if (/(^|\/)\.\.?(\/|$)/.test(fixed)) return;   // 有 . 或 .. 這種段落就不動,免得跳出站根
  var target = base + fixed.split('/').map(encodeURIComponent).join('/');
  if (target.charAt(1) === '/') return;   // 絕不產生 // 開頭的網址(那會被當成別的網站)
  location.replace(target + location.search + location.hash);
})();
</script>
